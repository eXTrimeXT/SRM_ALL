spring:
  redis:
    lettuce:
      pool:
        max-active: 10
        max-wait: -1ms
        min-idle: 0
        max-idle: 5
    database: ${ipaas.redis.database:11}
    password: ${global.redis.password}
    sentinel:
      master: ${global.redis.sentinel.master}
      nodes: ${global.redis.sentinel.nodes}
  datasource:
    dynamic:
      druid:
        initialSize: 0  #初始连接数，默认0
        minIdle: 5 # 池中维护的最小空闲连接数，默认为 0 个
        maxActive: 20 # 池中最大连接数，包括闲置和使用中的连接，默认为 8 个。
        maxWait: 60000 #获取连接的最大等待时间，单位毫秒
        stat: # 配置 StatFilter ，对应文档 https://github.com/alibaba/druid/wiki/%E9%85%8D%E7%BD%AE_StatFilter
          logSlowSql: true # 开启慢查询记录
          slowSqlMillis: 5000 # 慢 SQL 的标准，单位：毫秒
          mergeSql: true # SQL合并配置
        #缓存PreparedStatement的最大数量，默认-1（不缓存）。大于0时会自动开启缓存PreparedStatement
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j,wall #监控统计用的filter:stat,日志用的filter:log4j,防御sql注入的filter:wall
      primary: mysql
      datasource:
        mysql:
          type: com.alibaba.druid.pool.DruidDataSource
          url: jdbc:mysql://${ipaas.db.host}:${ipaas.db.port}/${ipaas.db.schema}?${global.jdbc.connection.params}
          username: ${ipaas.db.username}
          password: ${ipaas.db.password}
          driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    #开发环境设置为false，其他环境开启true
    enabled: true
    # 迁移前校验 SQL 文件是否存在问题
    validate-on-migrate: true
    # 一定要设置为true，否则会清空数据库
    clean-disabled: true
    # 最开始已经存在表结构，且不存在 flyway_schema_history 表时，需要设置为 true
    baseline-on-migrate: true
    # 基础版本，为老项目（未包含flyway的版本）升级时，一定要根据实际项目的情况设置baseline-version，跳过已存在表的脚本
    baseline-version: 0
    # 区分oracle 和 mysql
    locations: classpath:db/migration/mysql

generic-store:
  url: jdbc:mysql://${ipaas.db.host}:${ipaas.db.port}/${ipaas.db.store.schema}?${global.jdbc.connection.params}
  username: ${ipaas.db.username}
  # 使用数据库DbConnectUtil的加密   9607#VCOv%czsJ,d
  password: ${ipaas.db.password}
  timeout: 10000
  type: 1

eureka:
