j2cache:
  # L1缓存配置
  l1-cache:
    # Region配置
    region:
      # 默认的caffeine配置，支持10000个，1H ttl
      default: "10000, 1h"
      # 自定义L1 cache配置
      user-cache: "1000, 1m"

# redisson:
#   lock:
#     server:
#       address: mymaster,${global.redis.sentinel.nodes}
#       type: sentinel
#       password: ${global.redis.password}
#       database: 11
redisson:
  lock:
    server:
      # address: 10.26.34.97:30202    ##sentinel-哨兵配置(第一个主节点名称，后面是)： 
      address: mymaster,${global.redis.sentinel.nodes}
      type: sentinel   #连接类型，支持standalone-单机节点，sentinel-哨兵，cluster-集群，masterslave-主从
      database: 11
      password: ${global.redis.password}
      waitTime: 66 #注解aop能力，的分布式锁的等待时间
      leaseTime: 66  #注解aop能力，的分布式锁的续约时间
      config:      ##redisson的其他配置项
        pingConnectionInterval: 5
        retryAttempts: 38
        connectTimeout: 60000
springfox:
  documentation:
    # 总开关（同时设置auto-startup=false，否则/v3/api-docs等接口仍能继续访问）
    enabled: false
    auto-startup: false
    swagger-ui:
      enabled: false
cxf:
  servlet:
    init:
      hide-service-list-page : true
apaas:
  snowflake:
    enable: false
    port: 10070
    mode: redis
    # 应对 异地多活 数据中心 当前支持最大数据中心数是16
    #    datacenter: 12
    redis:
      host: 127.0.0.1:6666
      database: ${ipaas.redis.database:11}
      password: ${global.redis.password}
      # sentinel:
    #     master: ${global.redis.sentinel.master}
    #     nodes: ${global.redis.sentine.nodes}
  metrics:
    enable: false
    address: ${global.apaas.register-address}
  client:
    audit:
      #是否启用审计功能，默认为true（需要关闭，可设置为false。）
      enable: false
      # 应用code，与IAM系统的appCode需要一致，用于权限控制。
      # 应用名称，默认${spring.application.name}
      #      app-name: ipaas
      # 服务code,用于应用有多个服务时区分，不填默认app-code
      #      service-code: ipaas-admin
      # 服务名,用于应用有多个服务时区分，不填默认app-name
      #      service-name: ipaas-admin
      # 审计规则注册匹配规则，默认不用配置，全部export
      exporter-url:
        # 需要注册的url
        #include-path:
        #  - /user/**
        # 不用注册的url
        exclude-path:
          - /**
      # 审计控制台地址，使用naocos方式不用填，否则填入审计日志域名，例如https://apaas-dev-stable.meicloud.com/
      register-address:
      # 日志上报方式，可以选择1、rocketMq方式上报（默认），2、使用http的方式上报
      log-writer:
        # 1、日志上报方式，默认rocketMq
        type: rocketmq
        # rocketmq配置（不需配置，默认从global-env.properties获取）
        rocketmq:
          # rocketmq地址（不需配置，默认从global-env.properties获取）
          namesrvAddr:
          # accesskey、secretkey（不需配置，默认从global-env.properties获取）
          accesskey:
          secretkey:

ipaas:
  upload:
    file:
      # 100M
      maxFileSize: 100
      maxRequestSize: 100

system-protect:
  enabled: true
  highest-single-system-load: 2.5
  highest-cpu-usage: 0.9

feign:
  client:
    config:
      default:
        connectTimeout: 11000
        readTimeout: 11000

xxl:
  job:
    access-token: ${ipaas.xxljob.accessToken}
    admin:
      addresses: ${ipaas.xxljob.addresses}
      username: admin
      password: ${ipaas.xxljob.password}
    retry:
      enabled: true
      enable-flyway-migration: false
    executor:
      appname: ${ipaas.xxljob.executor.appname}
      title: ipaas-task
      enable-auto-create: true
      logpath: ${ipaas.xxljob.logpath}

seata:
  enabled: false
  enable-auto-datasource-proxy: false
  application-id: ipaas-seata-prd
  tx-service-group: ipaas-seata-prd
  service:
    vgroup-mapping:
      #ipaas-seata-${global.env}(此key必须跟tx-service-group配置项的值一致)
      ipaas-seata-prd: default
    group-list:
      default: 10.211.55.5:8091 # seata服务端地址,启用seata时必须修改
  client:
    rm:
      lock:
        retry-interval: 10
        retry-times: 5
        retry-policy-branch-rollback-on-conflict: true
    tm:
      commit-retry-count: 5
      rollback-retry-count: 5
    undo:
      data-validation: true # 二阶段回滚镜像校验（默认true开启）
      log-serialization: jackson # undo序列化方式（默认jackson）
      log-table: seata_undo_log  # 自定义undo表名（默认undo_log）