# redis 缓存连接配置
spring:
  redis:
    timeout: 60000
    lettuce:
      pool:
        max-active: 100
        max-wait: 10
        max-Idle: 10
        min-Idle: 0
    password: ${srm.redis.password}
    host: ${global.redis.host}
    port: ${global.redis.port}
#    sentinel:
#      master: ${global.redis.sentinel.master}
      # password: ${global.redis.sentinel.password}
#      nodes: ${global.redis.sentinel.nodes}
# druid数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${srm.db.common.username}
    password: ${srm.db.common.password}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      runtime:
        url: ${srm.db.urlPrefix}/${srm.schema.ide_runtime}?useUnicode=true&useAffectedRows=true&characterEncoding=utf-8&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&serverTimezone=Europe/Moscow
      initial-size: 5
      min-idle: 5 #回收空闲连接时，将保证至少有minIdle个连接
      max-active: 100
      max-wait: 10000 #程序向连接池中请求连接时,超过maxWait的值后，认为本次请求失败
      time-between-eviction-runs-millis: 60000 #检查空闲连接的频率，单位毫秒
      remove-abandoned: true #要求程序从池中get到连接后, N 秒后必须close,否则druid 会强制回收
      remove-abandoned-timeout: 7200 #设置druid 强制回收连接的时限，当程序从池中get到连接开始算起，超过此  应大于业务运行最长时间值后，druid将强制回收该连接，单位秒
      test-while-idle: true #当程序请求连接，池在分配连接时，是否先检查该连接是否有效
      validation-query: select 2 #检查池中的连接是否仍可用的 SQL 语句,drui会连接到数据库执行该SQL mysql:select 1,oracle:select 1 from dual
      filter:
        stat:
          enabled: true #默认值为true，监控sql,慢sql等功能
          log-slow-sql: true
          slow-sql-millis: 5000
        wall:
          enabled: false #默认值为false，sql防火墙，支持过滤sql，如禁止使用delete *等操作。
      stat-view-servlet:
        enabled: ${srm.db.druid.statViewServlet.enabled}
        login-username: ${srm.db.druid.statViewServlet.username}
        login-password: ${srm.db.druid.statViewServlet.password}
        allow: 10.1.1.1/8,172.1.1.1/8,192.1.1.1/8 #配置允许访问监控页面的IP地址
      web-stat-filter:
        enabled: false #默认值为true，统计web关联的监控信息如session/url等，建议修改为false
        session-stat-enable: false #该功能模块代码不完善，特定场景下会诱发异常，非特别需求，建议修改为false
      connection-properties: remarksReporting=true
# spring 相关配置
  mvc:
    servlet:
      load-on-startup: 1
  aop:
    proxy-target-class: true
  messages:
    basename: i18n/messages
    encoding: UTF-8

  sleuth:
    sampler:
      probability: 1.0
    web:
      enabled: true
    async:
      enabled: false
    integration:
      enabled: false
    scheduled:
      enabled: false
    feign:
      enabled: false
    zuul:
      enabled: false
# 最大上传文件和请求包大小配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# flyway配置
  flyway:
    # 如果数据库不是空表，需要设置成 true，否则启动报错
    baseline-on-migrate: true
    # 与 baseline-on-migrate: true 搭配使用
    baseline-version: 1.0.0
    encoding: UTF-8
    # 禁止清理数据库表
    clean-disabled: true
    # 校验
    validate-on-migrate: false
    # 版本控制日志表，默认flyway_schema_history,不同系统建议修改改数据
    table: flyway_schema_history
    sql-migration-separator: _
    placeholder-prefix: "_${"
    placeholders:
      placeholder_database_cloud_biz_pj: ${srm.db.schemaPrefix}${srm.schema.cloud_biz_pj}
      placeholder_database_cloud_biz_base: ${srm.db.schemaPrefix}${srm.schema.cloud_biz_base}
