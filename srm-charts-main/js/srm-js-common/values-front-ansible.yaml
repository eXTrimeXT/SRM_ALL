global:
  #环境
  env: dev
  product: srm
  lang: js
  #模块名
  module: front
  namespace: dev
#--程序1参数
app1:
#--容器副本数量
  replicas:
    dev: 1
    default: 1
#--容器需要外部访问，则设置为NodePort,设置为ClusterIP则限制只能容器内部访问
  type: NodePort
  #type: ClusterIP
#--镜像路径
  repository: hub.gwm.cn/feishengchancaigoushuzihuapingtai-test/app/srm-prd-russia/srm-front
#--镜像标签
  tag:
    default: latest
#--容器运行端口
  #port:
  clusterIP:
    enable: false
    ports:
      - name: js-80
        port: 80
        protocol: TCP
  nodePort:
    enable:
      dev: true
      sit: false
      uat: false
      prd: false
      pet: false
      default: false
    ports:
      - name: js-80
        port: 80
        protocol: TCP
#--容器外部访问端口
        nodePort:
          dev: 33045
          sit: 33045
          uat: 34045
          pet: 35045
          prd: 36045
          default: 37045
#--程序最大可用资源
  limits:
    cpu: 500m
    memory: 1Gi
#--程序最少运行资源  requests:
  requests:
    cpu: 100m
    memory: 200Mi
#--启用configmap挂载文件，则设置enable为ture并填写挂载文件的路径，内容需在configmap.yaml文件修改
  configmap:
    enable: true
    # 对应k8s configmap的name
    name: srm-js-config
    mounts:
        # 挂载到镜像实例上的文件路径
      - mountPath: /etc/nginx/nginx.conf
      # configMap对应的data key
        subPath: nginx.conf
#--如需创建持久卷,则设置enables为ture并填写卷的容量及挂载的路径
  persistentvolumeclaim:
    enable: false
    storage: 1Gi
    mountpath: /apps/data
  kvenv:
#    - key: JAVA_OPTS
#      val: -Xms1000m -Xmx2000m -Xmn512m -Xss256k -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=128m #默认值
  #    - key: JAVA_OPTS_enable
  #      val: true
  #    - key: APP_OPTS
  #      val: --spring.cloud.nacos.discovery.server-addr=ip:8848 --spring.cloud.nacos.discovery.namespace=44662d3f-dcfa-452f-bdxxxxxxx #默认为空



  secretenv:

healthCheck:
  #enabled: {{global.charts.healthCheck.enable}}
  type: tcp  # http/tcp
  port: 80  # 健康检查的端口名或端口
  httpPath: '/'  # http时必须设置
  livenessInitialDelaySeconds: 10  # 初始延迟秒数
  livenessPeriodSeconds: 5  # 检测周期，默认值10，最小为1
  livenessfailureThreshold: 3 #探测成功后，最少连续探测失败多少次才被认定为失败。默认是3。最小值是1
  livenesstimeoutSeconds: 2  #探针执行检测请求后，等待响应的超时时间，默认为 1s，单位“秒”，最小值是 1
  livenesssuccessThreshold: 1  #探针检测失败后认为成功的最小连接成功次数，默认为 1，最小值为 1。
  readinessInitialDelaySeconds: 10  # 初始延迟秒数
  readinessPeriodSeconds: 5   # 检测周期，默认值10，最小为1
  readinessfailureThreshold: 3 #探测成功后，最少连续探测失败多少次才被认定为失败。默认是3。最小值是1
  readinesstimeoutSeconds: 2  #探针执行检测请求后，等待响应的超时时间，默认为 1s，单位“秒”，最小值是 1
  readinesssuccessThreshold: 1  #探测失败后，最少连续探测成功多少次才被认定为成功。默认是1。对于liveness必须是1。最小值是1。

skywalking:
#  enable: false
  JAVA_TOOL_OPTIONS: -javaagent:/usr/skywalking/agent/skywalking-agent.jar
  BACKEND_SERVICES: 192.168.20.164:11800


#nodeSelector: {}
#  env: test
#需要使用此功能的时候，去掉{}

tolerations:
  enabled:
    pet: true
    default: false
  keys:
    - effect: NoSchedule
      key: pet
      value: true
