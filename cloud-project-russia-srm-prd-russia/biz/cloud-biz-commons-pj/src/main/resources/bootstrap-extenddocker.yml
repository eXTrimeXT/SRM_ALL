# docker-dev环境配置
spring:
  cloud:
    config:
      profile: docker
    #      name: application-extenddocker,${spring.application.name}
    nacos:
      discovery:
        # 命名空间，注册到srm-docker环境
        namespace: srm-docker
        # 注册中心地址
        server-addr: http://10.16.87.99:8801
        metadata:
          # feign微服务调用路由策略标签分组
          routingTag: docker
      config:
        # 命名空间，获取srm-docker命名空间的配置文件
        namespace: srm-docker
        # 配置中心地址
        server-addr: http://10.16.87.99:8801

# 微服务feign调用自定义路由策略，优先按照标签组[微服务元数据metadata.routingTag值]调用
ribbon:
  rule: tag

# swagger文档
knife4j:
  production: true

