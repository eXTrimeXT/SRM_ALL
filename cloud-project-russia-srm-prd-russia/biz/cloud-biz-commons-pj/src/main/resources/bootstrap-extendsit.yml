# sit环境配置
spring:
  cloud:
    config:
      profile: sit
    #      name: application-extendsit,${spring.application.name}
    nacos:
      discovery:
        # 命名空间，注册到srm-sit环境
        namespace: srm-project-sit
        # 注册中心地址
        server-addr: http://10.16.87.99:8801
        metadata:
          # feign微服务调用路由策略标签分组
          routingTag: sit
      config:
        # 命名空间，获取srm-sit命名空间的配置文件
        namespace: srm-project-sit
        # 配置中心地址
        server-addr: http://10.16.87.99:8801

# 微服务feign调用自定义路由策略，优先按照标签组[微服务元数据metadata.routingTag值]调用
ribbon:
  rule: tag

# swagger文档
knife4j:
  production: false

