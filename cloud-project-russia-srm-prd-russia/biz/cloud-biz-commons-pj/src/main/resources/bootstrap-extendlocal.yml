# local环境配置
spring:
  cloud:
    config:
      profile: local
    #      name: application-extendlocal,${spring.application.name}
    nacos:
      discovery:
        # 命名空间，注册到srm-dockeruat环境
        namespace: uat
        # 注册中心地址
#        server-addr: http://10.246.99.228:8848
        server-addr: http://10.168.154.42:8848
        group: uat
        metadata:
          # feign微服务调用路由策略标签分组
          routingTag: local
        # 账号密码访问
        username: nacos
        password: nacos
#        password: ENC(1bee7a35864e8a2ce35bf7a044c16ea8820ea668c578f9dc24d466078a3f64c3)
      config:
        # 命名空间，获取srm-dockeruat命名空间的配置文件
        namespace: uat
        group: srm
        # 配置中心地址
#        server-addr: http://10.246.99.228:8848
        server-addr: http://10.168.154.42:8848
        # 账号密码访问
        username: nacos
        password: nacos
#        password: ENC(1bee7a35864e8a2ce35bf7a044c16ea8820ea668c578f9dc24d466078a3f64c3)
  devtools:
    restart:
      enabled: true

# 微服务feign调用自定义路由策略，优先调用本地已存在微服务，找不到本地服务，按照标签组[微服务元数据metadata.routingTag值]调用
ribbon:
  rule: local

eureka:
  client:
    serviceUrl:
      defaultZone: http://10.16.87.99:8761/eureka/
# swagger文档
knife4j:
  production: false

